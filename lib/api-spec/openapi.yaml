openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product catalog
  - name: orders
    description: Customer orders
  - name: admin
    description: Manager operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List product categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for managers
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, picking, delivery, completed]
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a customer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreated"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/summary:
    get:
      operationId: getOrderSummary
      tags: [admin]
      summary: Get order dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        price:
          type: number
        quantity:
          type: number
        category:
          type: string
        imageUrl:
          type: string
      required: [id, name, price, quantity, category, imageUrl]
    OrderItem:
      type: object
      properties:
        productId:
          type: number
        productName:
          type: string
        quantity:
          type: number
        price:
          type: number
        lineTotal:
          type: number
      required: [productId, productName, quantity, price, lineTotal]
    Order:
      type: object
      properties:
        id:
          type: number
        clientName:
          type: string
        phone:
          type: string
        address:
          type: string
        totalSum:
          type: number
        status:
          type: string
          enum: [new, picking, delivery, completed]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required: [id, clientName, phone, address, totalSum, status, createdAt, items]
    OrderInput:
      type: object
      properties:
        clientName:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 5
        address:
          type: string
          minLength: 5
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
      required: [clientName, phone, address, items]
    OrderItemInput:
      type: object
      properties:
        productId:
          type: number
        quantity:
          type: number
          minimum: 1
      required: [productId, quantity]
    OrderCreated:
      type: object
      properties:
        orderId:
          type: number
        totalSum:
          type: number
      required: [orderId, totalSum]
    OrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [new, picking, delivery, completed]
      required: [status]
    OrderSummary:
      type: object
      properties:
        totalOrders:
          type: number
        totalRevenue:
          type: number
        newOrders:
          type: number
        pickingOrders:
          type: number
        deliveryOrders:
          type: number
        completedOrders:
          type: number
      required: [totalOrders, totalRevenue, newOrders, pickingOrders, deliveryOrders, completedOrders]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

